<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f5f9"/>
      <stop offset="100%" style="stop-color:#94a3b8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cbd5e1;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#475569;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Subtle border -->
  <rect width="100" height="100" rx="22" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.2"/>
  <!-- Corner glow -->
  <circle cx="25" cy="25" r="35" fill="url(#glow)"/>
  <!-- UA monogram -->
  <text x="50" y="65" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="800" fill="url(#accent)" text-anchor="middle" letter-spacing="-2">UA</text>
  <!-- Subtle underline accent -->
  <line x1="22" y1="74" x2="78" y2="74" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4"/>
</svg>
